version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - hitl-data:/data
    environment:
      - DB_PATH=/data/hitl.db
      - LLM_MOCK=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["python", "/app/seed.py"]
    volumes:
      - hitl-data:/data
    environment:
      - DB_PATH=/data/hitl.db
      - LLM_MOCK=true
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - seed

volumes:
  hitl-data:
