# =============================================================================
# nginx as the platform's edge load balancer.
#
# THE TWO KINDS OF LOAD BALANCING IN THIS PROJECT
#
#   1. SERVER-SIDE (here). Clients connect to nginx; nginx picks a gateway instance.
#      The client knows nothing about how many gateways exist. This is the only option
#      when the client is a browser or a third-party server — they cannot be asked to
#      consult a service registry.
#
#   2. CLIENT-SIDE (Spring Cloud LoadBalancer, inside the gateway). The gateway asks
#      Eureka which payment-service instances are healthy and picks one itself. No extra
#      network hop, and it reacts to scaling immediately.
#
#   Rule of thumb: server-side at the edge, where you do not control the client;
#   client-side internally, where you do.
# =============================================================================

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # The request id is logged here and, because it is passed through, in every service's
    # logs too. One grep across the whole platform.
    log_format paykit '$remote_addr - [$time_local] "$request" $status '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      'req_id=$http_x_request_id';

    access_log /var/log/nginx/access.log paykit;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 1m;   # a payments API has no business accepting large uploads

    # Docker's embedded DNS server. 'valid=10s' re-resolves every 10 seconds, which is what
    # makes `docker compose up --scale api-gateway=3` work: nginx picks up new replicas
    # without a reload. A plain `upstream` block resolves once at startup and would keep
    # sending traffic to a container that no longer exists.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting at the edge, in front of the gateway's own per-merchant limits.
    # This one is per-IP and exists to absorb crude floods before they cost us a Redis
    # round trip. Defence in depth: the cheap check runs first.
    limit_req_zone $binary_remote_addr zone=edge:10m rate=200r/s;
    limit_req_status 429;

    upstream gateway_pool {
        # least_conn beats round-robin when request durations vary a lot, which they do
        # here: a confirm that waits on the card network takes far longer than a GET.
        # Round-robin would keep handing work to an instance already stuck on slow calls.
        least_conn;
        server api-gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Do not advertise the version; it is free reconnaissance for an attacker.
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location /health {
            access_log off;
            return 200 '{"status":"UP","component":"nginx"}';
        }

        location / {
            limit_req zone=edge burst=400 nodelay;

            set $gateway http://gateway_pool;
            proxy_pass $gateway;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            # Without these, every request appears to come from nginx's own IP and per-client
            # rate limiting silently becomes global rate limiting.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $http_x_request_id;

            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Retry the next instance only on connection-level failures. 'error' and
            # 'timeout' after the request has been sent are deliberately NOT retried for
            # writes — nginx cannot tell whether a POST /confirm was already processed, and
            # a blind retry there is a double charge.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
