[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragx"
version = "1.0.0"
description = "Retrieval-augmented answering over company documentation, with citations and an eval harness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]
hosted-embeddings = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Header() in parameter defaults is the framework idiom.
"src/ragx/service/app.py" = ["B008"]
